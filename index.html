<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawShelf</title>
<meta name="description" content="A small character peeks out from the edge of your Mac screen and holds files, folders, images, links and text while you switch between apps.">
<link rel="alternate" hreflang="en" href="https://archivelab-kr.github.io/pawshelf/en/">
<link rel="alternate" hreflang="ko" href="https://archivelab-kr.github.io/pawshelf/ko/">
<link rel="alternate" hreflang="ja" href="https://archivelab-kr.github.io/pawshelf/ja/">
<link rel="alternate" hreflang="zh-Hans" href="https://archivelab-kr.github.io/pawshelf/zh-hans/">
<link rel="alternate" hreflang="de" href="https://archivelab-kr.github.io/pawshelf/de/">
<link rel="alternate" hreflang="es" href="https://archivelab-kr.github.io/pawshelf/es/">
<link rel="alternate" hreflang="fr" href="https://archivelab-kr.github.io/pawshelf/fr/">
<link rel="alternate" hreflang="it" href="https://archivelab-kr.github.io/pawshelf/it/">
<link rel="alternate" hreflang="nl" href="https://archivelab-kr.github.io/pawshelf/nl/">
<link rel="alternate" hreflang="pt-BR" href="https://archivelab-kr.github.io/pawshelf/pt-br/">
<link rel="alternate" hreflang="pt-PT" href="https://archivelab-kr.github.io/pawshelf/pt-pt/">
<link rel="alternate" hreflang="x-default" href="https://archivelab-kr.github.io/pawshelf/">
<link rel="icon" type="image/png" href="assets/favicon.png">
<script>
(function () {
  var slugs = {"en": "en", "ko": "ko", "ja": "ja", "zh-hans": "zh-hans", "de": "de", "es": "es", "fr": "fr", "it": "it", "nl": "nl", "pt-br": "pt-br", "pt-pt": "pt-pt"};
  var pick = "en";
  var prefs = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < prefs.length; i++) {
    var l = prefs[i].toLowerCase();
    if (slugs[l]) { pick = l; break; }
    if (l.indexOf("zh") === 0) { pick = "zh-hans"; break; }
    if (l.indexOf("pt") === 0) { pick = "pt-br"; break; }
    var base = l.split("-")[0];
    if (slugs[base]) { pick = base; break; }
  }
  location.replace(pick + "/");
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
</head>
<body>
<ul><li><a href="en/" lang="en">English</a></li><li><a href="ko/" lang="ko">한국어</a></li><li><a href="ja/" lang="ja">日本語</a></li><li><a href="zh-hans/" lang="zh-Hans">简体中文</a></li><li><a href="de/" lang="de">Deutsch</a></li><li><a href="es/" lang="es">Español</a></li><li><a href="fr/" lang="fr">Français</a></li><li><a href="it/" lang="it">Italiano</a></li><li><a href="nl/" lang="nl">Nederlands</a></li><li><a href="pt-br/" lang="pt-BR">Português (Brasil)</a></li><li><a href="pt-pt/" lang="pt-PT">Português (Portugal)</a></li></ul>
</body>
</html>
